; Luna Capture installer configuration.
;
; The installer downloads LunaCapture-portable.zip from the chosen GitHub
; release and expands it into the install folder. build_release.bat produces
; that archive in dist\ — attach it to the release alongside LunaSetup.exe.
;
; TargetVersion pins which published release the installer downloads.
; Use an exact version to ship a fixed build, or "latest" to always take the
; newest published release.
;
; When a newer release exists than the pinned one, the installer shows it on the
; first page and offers a one-click switch — it never upgrades silently.
;
; This file must sit next to LunaSetup.exe. If it is missing, the installer
; behaves as if TargetVersion=latest.

TargetVersion=latest
